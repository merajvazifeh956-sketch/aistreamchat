# Deploy on any VPS (where proxying is allowed by the host):
#   docker compose up -d
#
# Panel  : http://SERVER_IP:2053/panel   (admin / admin)
# Proxy  : port 443 (VLESS + WebSocket, or Reality)
services:
  x-ui:
    build: .
    container_name: x-ui
    restart: always
    ports:
      - "2053:2053"   # web panel
      - "443:443"     # proxy traffic
    environment:
      - TZ=Asia/Tehran
      - WEB_PORT=2053
      - WEB_PATH=panel          # fixed panel path (remove for a random one)
      # Optional runtime tweaks (passed straight to x-ui):
      # - XUI_LOG_LEVEL=info
      # - XUI_ENABLE_FAIL2BAN=false
      # - XUI_TUNNEL_HEALTH_MONITOR=true
      # - XUI_TUNNEL_HEALTH_URL=https://www.cloudflare.com/cdn-cgi/trace
    volumes:
      - ./data:/etc/x-ui         # persistent panel + SQLite DB
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-sS", "--max-time", "8", "http://127.0.0.1:2053/", "-o", "/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
